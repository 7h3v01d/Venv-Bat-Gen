name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable, no PyQt6)
        # core.py — where every template generator, the scanner, and the
        # manifest/update logic live — has zero Qt imports by design; the
        # GUI tests skip themselves here and run in the gui-smoke job.
        # uv is installed so the live `uv sync` test runs too.
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest pytest-cov uv

      - name: Show live-test tooling
        # pwsh ships on every GitHub-hosted runner: the generated .ps1
        # scripts are executed for real on all three OSes. On Windows the
        # generated .bat scripts run under the real cmd.exe and the .ps1
        # scripts under Windows PowerShell 5.1 (tests/test_windows_live.py).
        shell: bash
        run: |
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' || echo "no pwsh"
          uv --version

      - name: Run tests
        run: pytest -rs --cov=venv_bat_gen.core --cov=venv_bat_gen.cli --cov=venv_bat_gen.gui_launcher --cov-report=term-missing

  gui-smoke:
    name: gui smoke tests (pytest-qt, offscreen)
    runs-on: ubuntu-latest
    # Non-blocking for now: verified working locally (PyQt6 imports, a real
    # QApplication + App window construct, and 21 smoke tests pass headlessly
    # via QT_QPA_PLATFORM=offscreen), but not yet confirmed on an actual
    # GitHub-hosted runner, which may be missing a system Qt library PyQt6's
    # wheel doesn't bundle. Flip continue-on-error off once a run here is
    # green — this job already caught one real bug (a preset-save allowlist
    # that silently dropped include_powershell), so it's worth keeping.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries
        # PyQt6 wheels bundle Qt itself but still load a few system
        # libraries even on the offscreen platform.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package with GUI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev-gui]"

      - name: Run GUI tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_gui_smoke.py tests/test_gui_v36.py -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (pinned — see [tool.ruff.lint] in pyproject.toml)
        run: pip install ruff==0.17.2

      - name: Run ruff
        run: ruff check .

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: pip install twine && twine check dist/*
